<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Inflate">
  <title>Inflate</title>
  <rect width="400" height="400" rx="48" fill="#0E0E0F"/>

  <!-- Balloon: bulb (stroked circle) + tied-end triangle + string -->
  <g fill="none" stroke="#E8954A" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main bulb of the balloon -->
    <circle cx="200" cy="170" r="92" stroke-width="22" fill="#E8954A" fill-opacity="0"/>

    <!-- Tied knot at the bottom of the balloon (small triangle) -->
    <path d="M 188 262 L 200 282 L 212 262 Z" fill="#E8954A" stroke-width="0"/>

    <!-- String trailing down with a slight curl -->
    <path d="M 200 282 Q 196 320 208 340" stroke-width="6"/>
  </g>
</svg>
