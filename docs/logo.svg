<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Inflate">
  <title>Inflate</title>

  <rect width="400" height="400" rx="48" fill="#0E0E0F"/>

  <g fill="none" stroke="#E8954A" stroke-width="30"
     stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 84 132 L 152 200 L 84 268"/>
  </g>

  <!-- Bars now have typographic-hierarchy weights, not just lengths.
       Heading: heaviest stroke (display weight). Paragraph: medium
       (the dominant body mass, unchanged from v1). Bullet: lightest
       (supporting). The rhythm now reads as real document structure. -->
  <g stroke="#E8954A" stroke-linecap="round">
    <line x1="192" y1="140" x2="280" y2="140" stroke-width="26"/>
    <line x1="192" y1="200" x2="344" y2="200" stroke-width="22"/>
    <line x1="192" y1="260" x2="308" y2="260" stroke-width="18"/>
  </g>
</svg>
